[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterpilot"
version = "0.1.0"
description = "Agentic AI coding partner for JupyterHub and IPython"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests",
    "ipython",
    "litellm"
]
authors = [
    {name = "Wajoud", email = "wajoud@example.com"}
]

[project.optional-dependencies]
dev = ["black", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
