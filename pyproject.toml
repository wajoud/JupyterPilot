[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterpilot"
version = "0.2.0"
description = "Agentic AI coding partner for JupyterHub and IPython"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Hub-side infrastructure (always installed)
    "requests>=2.31.0",
    "paramiko>=3.4.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
]
authors = [
    {name = "Wajoud", email = "wajoud@example.com"}
]

[project.optional-dependencies]
# Install AI features: pip install jupyterpilot[ai]
ai = [
    "ipython>=8.0.0",
    "litellm>=1.30.0",
    "mcp>=1.0.0",
]
dev = [
    "black",
    "pytest",
    "pytest-anyio",
    "anyio",
    "mypy",
    "flake8",
    "types-requests",
    "types-paramiko",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jupyterpilot*"]
